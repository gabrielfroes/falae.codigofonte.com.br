# Compose de produção para deploy via Dokploy — sem Postgres, Redis nem
# Caddy: aqui assumimos que Postgres e Redis são serviços separados,
# criados à parte no Dokploy (Database apps), e que o Traefik embutido do
# Dokploy cuida de domínio/HTTPS (configurado pela UI dele, não aqui).
#
# DATABASE_URL e REDIS_URL (no .env desta aplicação) precisam apontar para
# esses serviços externos — veja docs/deploy-dokploy.md.
#
# Uso local: continue usando docker-compose.yml (tem Postgres, Redis e
# Caddy inclusos, nada muda aí).

services:
  migrate:
    build: .
    command: ["pnpm", "db:migrate"]
    env_file: .env
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    command: ["pnpm", "start"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    restart: unless-stopped
    command: ["pnpm", "worker"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
